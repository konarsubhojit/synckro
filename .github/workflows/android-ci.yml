name: Android CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build-apks:
    name: Build debug + testing release APKs
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","android-builder"]') }}
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: ${{ github.event_name == 'pull_request' && format('{0}/.android-sdk', github.workspace) || '/opt/android-sdk' }}
      ANDROID_API_LEVEL: '34'
      ANDROID_BUILD_TOOLS_VERSION: '34.0.0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up JDK 21
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify preinstalled JDK 21
        if: github.event_name != 'pull_request'
        env:
          JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
        run: |
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        if: github.event_name == 'pull_request'
        uses: gradle/actions/setup-gradle@v4
        with:
          # Hosted PRs use the GitHub Actions cache; the self-hosted runner
          # uses its persistent Gradle user home instead.
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Restore Android SDK cache (read-only on PRs)
        uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_API_LEVEL }}-build-tools-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-v1
          restore-keys: |
            ${{ runner.os }}-android-sdk-${{ env.ANDROID_API_LEVEL }}-build-tools-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-
            ${{ runner.os }}-android-sdk-${{ env.ANDROID_API_LEVEL }}-
            ${{ runner.os }}-android-sdk-

      - name: Set up Android SDK
        if: github.event_name == 'pull_request'
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}

      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/debug.keystore"
          fi

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # Optional: only present on repos/forks with Firebase configured. The
          # google-services and Crashlytics Gradle plugins are applied
          # conditionally (see app/build.gradle.kts) so the build stays green
          # when this secret is absent.
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "${{ github.workspace }}/app/google-services.json"
          fi

      - name: Derive per-build-type MSAL redirect URIs
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MSAL_REDIRECT_URI: ${{ secrets.MSAL_REDIRECT_URI }}
        run: |
          # Gradle configures every build type up front, so each build type's
          # MSAL host validation must see a URI with its own applicationId
          # host. From the single MSAL_REDIRECT_URI secret, derive both the
          # debug- and release-form URIs and expose them as build-type-specific
          # env vars consumed by app/build.gradle.kts.
          if [ -z "$MS_CLIENT_ID" ] || [ -z "$MSAL_REDIRECT_URI" ]; then
            if [ -n "$MS_CLIENT_ID" ] || [ -n "$MSAL_REDIRECT_URI" ]; then
              echo "::warning::MS_CLIENT_ID and MSAL_REDIRECT_URI must both be set for CI auth config; continuing with OneDrive sign-in disabled."
            fi
            exit 0
          fi
          DEBUG_URI="$MSAL_REDIRECT_URI"
          RELEASE_URI="$MSAL_REDIRECT_URI"
          if [ -n "$MSAL_REDIRECT_URI" ]; then
            redirect_without_scheme="${MSAL_REDIRECT_URI#msauth://}"
            redirect_path="${redirect_without_scheme#*/}"
            if [ -n "$redirect_path" ] && [ "$redirect_path" != "$redirect_without_scheme" ]; then
              DEBUG_URI="msauth://com.synckro.debug/$redirect_path"
              RELEASE_URI="msauth://com.synckro/$redirect_path"
            fi
          fi
          echo "MS_CLIENT_ID=$MS_CLIENT_ID" >> "$GITHUB_ENV"
          echo "MSAL_REDIRECT_URI_DEBUG=$DEBUG_URI" >> "$GITHUB_ENV"
          echo "MSAL_REDIRECT_URI_RELEASE=$RELEASE_URI" >> "$GITHUB_ENV"

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck --no-daemon --console=plain

      - name: Verify unit-test coverage, lint, and assemble debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew verifyDebugUnitTestCoverage lintDebug assembleDebug --no-daemon --console=plain

      - name: Assemble testing release APK
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          ALLOW_DEBUG_KEYSTORE_FOR_RELEASE: 'true'
        run: ./gradlew assembleRelease

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: synckro-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      - name: Upload testing release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: synckro-testing-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

      - name: Upload unit-test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-tests-${{ github.run_number }}
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
